[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ubuntuaudit"
version = "0.1.0"
description = "Security health checker for Ubuntu systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = []

[project.scripts]
ubuntuaudit = "ubuntuaudit.cli:main"

[tool.setuptools]
packages = ["ubuntuaudit"]
